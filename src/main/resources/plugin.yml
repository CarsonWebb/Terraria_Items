name: TerrariaItems
version: '4.1.2'
main: me.carson.terrariaItems.TerrariaItems
api-version: '1.21'
commands:
  ti:
    description: Terraria Items main command
    usage: /ti <subcommand>
    permission: terrariaitems.ti
    permission-message: You don't have permission to use this.

permissions:
  terrariaitems.ti:
    description: Allows access to /ti command
    default: true
  terrariaitems.sub.give:
    description: Terraria Items Commands
    default: op
  terrariaitems.sub.toggle_message:
    description: Terraria Items Commands
    default: true
  terrariaitems.sub.accessory:
    description: Terraria Items Commands
    default: true
  terrariaitems.sub.vanity:
    description: Terraria Items Commands
    default: true
  terrariaitems.sub.undiscover:
    description: Terraria Items Commands
    default: true
  terrariaitems.sub.toggle_prehardmode_crafting:
    description: Terraria Items Commands
    default: op
  terrariaitems.sub.toggle_hardmode_crafting:
    description: Terraria Items Commands
    default: op
  terrariaitems.sub.toggle_blood_moon:
    description: Terraria Items Commands
    default: op
  terrariaitems.sub.summon_blood_moon:
    description: Terraria Items Commands
    default: op
  terrariaitems.sub.show_stats:
    description: Terraria Items Commands
    default: true